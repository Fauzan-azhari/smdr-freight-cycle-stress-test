[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smdr-covenant-stress-test"
version = "1.0.0"
description = "Sensitivitas covenant dan likuiditas PT Samudera Indonesia Tbk terhadap siklus freight rate: stress test berbasis skenario dan backtesting"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Fauzan Azhari Najib" }]
dependencies = ["numpy>=2.0", "pandas>=2.2", "matplotlib>=3.9", "scipy>=1.13", "statsmodels>=0.14", "openpyxl>=3.1", "pypdf>=5"]

[project.optional-dependencies]
notebook = ["jupyterlab>=4.5", "ipykernel>=6.31", "nbformat>=5.10"]
wci-fetch = ["akshare>=1.18"]

[tool.setuptools.packages.find]
where = ["src"]
